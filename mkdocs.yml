site_name: Text Processing for Mere Mortals
site_description: Plain-language text processing. grep to select lines, sed to edit them as they pass, awk to split lines into fields and do the arithmetic, practised on a specimen log, an account file, an order sheet, a config file, and one messy list.
site_url: https://paulsullivan33-dev.github.io/text-processing-for-mere-mortals/

